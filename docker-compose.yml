version: '3.8'

services: 

  listok_db:
    image: mysql
    restart: always
    env_file: ./server/secrets/.env
    environment: 
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: listok_db
    ports:
      - "3006:3306" # Port mapping correction
    volumes: 
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db-config:/etc/mysql
      - db-data:/var/lib/mysql
      - ./db/backup/files/:/data_backup/data

volumes:
  db-config:
  db-data:
